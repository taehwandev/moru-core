[package]
name = "moru-checkout-identity"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "moru_checkout_identity"
path = "src/lib.rs"

[[bin]]
name = "moru-checkout-identity"
path = "src/main.rs"

[[bin]]
name = "moru-native-launcher"
path = "src/launcher_main.rs"

[dependencies]
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10.9"

[profile.release]
strip = "symbols"
