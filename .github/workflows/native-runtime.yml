name: Native runtime bundles

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - native/checkout-identity/**
      - scripts/build_native_runtime.py
      - scripts/native-runtime-bundle.py
      - scripts/support/native_bundle.py
      # The native source guard binds every runtime Python module.
      - scripts/**/*.py
      - tests/test_native_*.py
      - tests/native_*support.py
      - tests/smoke_native_bundle.py
      - tests/test_agent_state_read.py
      - tests/test_agent_repository_key.py
      - tests/test_agent_observability.py
      - tests/test_agent_work_cards*.py
      - tests/_moru_test_support.py
      - tests/test_template_repository.py
      - tests/test_benchmark_read_inspection.py
      - tests/benchmark_read_inspection.py
      - tests/read_inspection_support.py
      - .github/workflows/native-runtime.yml

permissions:
  contents: read

jobs:
  bundle:
    if: github.event.repository.private == false && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos-arm64
          - runner: macos-15-intel
            platform: macos-x86_64
          - runner: ubuntu-24.04
            platform: linux-x86_64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
    runs-on: ${{ matrix.runner }}
    # Intel macOS exceeded 15 minutes while running the complete acceptance suite.
    timeout-minutes: ${{ startsWith(matrix.platform, 'macos-') && 30 || 15 }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - name: Prepare pinned developer toolchain and locked crates
        run: |
          rustup toolchain install 1.94.1 --profile minimal
          rustup default 1.94.1
          cargo fetch --locked --manifest-path native/checkout-identity/Cargo.toml
      - name: Build and verify runtime behavior
        run: |
          cargo test --locked --offline --manifest-path native/checkout-identity/Cargo.toml \
            --target-dir .moru/native/cargo-target
          cargo test --locked --offline --manifest-path native/checkout-identity/Cargo.toml \
            --target-dir .moru/native/cargo-target --features sha2/force-soft
          python3 scripts/build_native_runtime.py
          PYTHONPATH=scripts:tests python3 -B tests/run_native_session.py -m unittest \
            test_native_bundle test_native_migration_ledger test_checkout_identity_runtime test_native_stable_launcher \
            test_native_statusline test_native_runtime_status test_native_pretool test_native_pretool_files \
            test_native_pretool_git test_native_pretool_queries test_native_registry_read test_native_overhead_session \
            test_native_mailbox test_native_stop test_native_next test_native_next_active test_native_next_ledger test_native_manifest_checks test_native_figma_validate test_native_figma_decode test_agent_review_rust_visibility \
            test_native_next_freshness test_native_next_session test_native_next_owner test_native_next_discovery test_native_next_state_root test_native_next_cli test_native_next_ps test_native_next_paths test_native_next_verification \
            test_native_project_discovery test_native_project_registry test_native_workspace_discovery \
            test_native_request_paths test_native_work_cards test_native_card_settlement test_native_mailbox_status \
            test_native_completion test_agent_completion_checks test_agent_work_completion \
            test_agent_stop_continuation test_agent_continuation_packet test_agent_continuation_checkpoint \
            test_agent_state_read test_agent_repository_key test_agent_observability \
            test_agent_work_cards test_agent_work_cards_lifecycle test_benchmark_read_inspection \
            test_template_repository
      - name: Package and test a fresh consumer without a toolchain
        env:
          BUNDLE: moru-native-${{ matrix.platform }}.tar.gz
        run: |
          python3 scripts/native-runtime-bundle.py pack --bundle "$BUNDLE"
          PYTHONPATH=scripts:tests python3 -B tests/run_native_session.py tests/smoke_native_bundle.py --bundle "$BUNDLE"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: moru-native-${{ matrix.platform }}-${{ github.sha }}
          path: moru-native-${{ matrix.platform }}.tar.gz
          if-no-files-found: error
          retention-days: 7
